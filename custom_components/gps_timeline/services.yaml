backfill:
  name: Backfill history from recorder
  description: >-
    Imports existing location history from the Home Assistant recorder database
    into the GPS Timeline archive so older days are available before the recorder
    purges them.
  fields:
    entity_id:
      name: Tracker entity
      description: The entity tracked by GPS Timeline whose history should be imported.
      required: true
      selector:
        entity:
          filter:
            - domain: device_tracker
            - domain: person
            - domain: sensor
            - domain: geo_location
    start_time:
      name: Start time
      description: Earliest point to import. Defaults to 10 days before the end time.
      required: false
      selector:
        datetime:
    end_time:
      name: End time
      description: Latest point to import. Defaults to now.
      required: false
      selector:
        datetime:
purge:
  name: Delete archived data
  description: >-
    Permanently deletes the archived location history (points and companion
    states) for an entity. This cannot be undone. Deleting a live tracker's
    history reloads it with an empty timeline.
  fields:
    entity_id:
      name: Tracker entity
      description: The entity whose archived history should be deleted.
      required: true
      selector:
        entity:
          filter:
            - domain: device_tracker
            - domain: person
            - domain: sensor
            - domain: geo_location

import_google_timeline:
  name: Import Google Timeline JSON
  description: >-
    Reads a Google on-device JSON export (semanticSegments) from the same directory
    as gps_timeline.db, normally /config/gps_timeline/. Imports timelinePath points,
    visit locations, activity endpoints and rawSignals.position into points, and
    visits/activities into ordinary companion history. Raw positions retain accuracy,
    speed, altitude and their full source metadata. rawSignals.activityRecord supplies
    activity observations outside semantic activity intervals; the highest-confidence
    candidate is selected and all candidates remain in metadata. These observations
    have no invented duration. Optionally, activity.parking locations are imported
    exclusively into a separately configured car tracker, using parking.startTime
    even when it differs from the activity end. No person routes, visits or activities
    are copied to the car. Without car_entity_id, parking coordinates are skipped
    and logged; their original metadata remains in the person's activity history.
    No entities are created or updated. Existing rows
    are preserved. Only one coordinate is kept per tracker/timestamp: timelinePath
    takes precedence over raw positions, activity endpoints, then visit locations;
    the first point wins ties. The entire JSON is scanned in the background before changing the
    archive. Invalid individual records are skipped; malformed JSON or import failure
    leaves the archive unchanged. Repeating an import adds only missing rows.
    Each call creates a separate google_timeline_import_*.jsonl.gz diagnostic log
    beside the database. It lists every invalid, unsupported, duplicate or existing
    item with its JSON path, full source value and reason, including unknown sections
    and unused fields. Values are not sampled or truncated. The final log record
    reports completion and an inventory of all encountered JSON fields. Logs contain
    location data, are stored locally and are never uploaded automatically.
    timelineMemory trip summaries, Wi-Fi scans and userLocationProfile aggregates
    remain in the log with specific reasons: they do not define dated GPS points,
    visits or activity observations that fit the upstream archive.
    The optional response reports days with new records (Home Assistant timezone),
    inserted points/states, skipped points, source segment/visit/activity counts,
    raw position/activity counts, diagnostic counts and the log_file path.
    Car results are separate: parking_records_read, parking_points_inserted,
    parking_points_skipped and parking_days. Both tracker archives are committed
    together; a failure leaves both unchanged. Failures also report the log path.
  fields:
    entity_id:
      name: Tracker entity
      description: The source tracker already configured in GPS Timeline.
      required: true
      selector:
        entity:
          filter:
            - domain: device_tracker
            - domain: person
            - domain: sensor
            - domain: geo_location
    file_name:
      name: JSON filename
      description: Filename only, for example Timeline.json. No directory or upload.
      required: true
      example: Timeline.json
      selector:
        text:
    car_entity_id:
      name: Car tracker (parking only)
      description: >-
        Optional device_tracker entity already configured separately in GPS Timeline,
        for example device_tracker.car. Use the entity ID, not a device registry ID.
        Only activity.parking coordinates and their own startTime are written to this
        car's archive. It must differ from the person tracker and history entities.
        No driving route or parking duration is inferred. If multiple parking points
        have the same timestamp, the first wins; existing car points are preserved.
      required: false
      selector:
        entity:
          filter:
            - domain: device_tracker
    places_entity:
      name: Places history entity
      description: >-
        Entity ID for visit history. Defaults to the tracker’s configured Places
        entity. Required if the file has visits and no Places entity is configured.
        Only archive rows are written; no sensor is created. Use this same ID as
        places_entity in the timeline card.
      selector:
        entity:
    activity_entity:
      name: Activity history entity
      description: >-
        Entity ID for activity history. Defaults to the tracker’s configured activity
        entity. Required if the file has activities and none is configured.
        Only archive rows are written; no sensor is created. Use this same ID as
        activity_entity in the timeline card.
      selector:
        entity:
